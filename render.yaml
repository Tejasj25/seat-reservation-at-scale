services:
  - type: web
    name: seat-reservation-api
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: "20"
databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seats
    user: seats
